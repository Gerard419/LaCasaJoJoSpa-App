spring.application.name=usuarios-service
server.port=8081
server.address=0.0.0.0

# Base de datos H2 en archivo (persiste entre reinicios, carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/usuariosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la BD: http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:file:./data/usuariosdb)
spring.h2.console.enabled=true
