spring.application.name=menu-service
server.port=8082
server.address=0.0.0.0

# Base de datos H2 en archivo (persiste entre reinicios, carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/menudb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la BD: http://localhost:8082/h2-console  (JDBC URL: jdbc:h2:file:./data/menudb)
spring.h2.console.enabled=true

# Fotografías para compartir entre clientes y dueños, persistentes entre reinicios.
lacasajojo.fotos.directorio=./data/fotos
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
